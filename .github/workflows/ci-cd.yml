name: CI/CD
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  backend:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector:pg16
        env:
          POSTGRES_USER: findback
          POSTGRES_PASSWORD: findback
          POSTGRES_DB: findback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U findback"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall backend/app backend/alembic
      - name: Deployment rollback regression
        run: python infrastructure/test_deploy.py
      - name: Deployment trust and pipeline regression
        run: python infrastructure/verify_cicd.py
      # tests/test_schema_bootstrap.py shells out to `docker compose config`.
      # The real .env is gitignored, so on a clean runner Compose can fail on a
      # missing env file. Give it a placeholder one, and run the exact command
      # here first so any Compose error prints its stderr in the log (the
      # pytest failure only shows "exit status 1").
      - name: Prepare Docker Compose environment
        run: |
          docker compose version
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then cp .env.example .env; else touch .env; fi
          fi
          docker compose config --no-env-resolution --format json > /dev/null
      - run: pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql://findback:findback@localhost:5432/findback_test
          REDIS_URL: redis://localhost:6379/0
          DEV_AUTH_ENABLED: "true"
          # Every live-DB test module gates on TEST_DATABASE_URL (not
          # DATABASE_URL), so without this line they all skip and the job
          # passes on a little over half the suite.
          TEST_DATABASE_URL: postgresql://findback:findback@localhost:5432/findback_test
  mobile:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      # test/local_db_test.dart exercises the real SQLite statements through
      # sqflite_common_ffi, which loads the system SQLite on Linux.
      - name: Install SQLite (needed by the FFI database test)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      # android/ and ios/ are generated per developer machine by
      # tool/setup_mobile.sh; the Dart side neither needs nor imports them, so CI
      # stays fast by leaving them out.
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded
  deploy:
    needs: [backend, mobile]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: findback-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_URL: ${{ vars.ECR_REPOSITORY_URL }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build and publish immutable image
        run: |
          set -euo pipefail
          image="$ECR_URL:$GITHUB_SHA"
          registry="${ECR_URL%%/*}"
          repository="${ECR_URL#*/}"
          existing=$(aws ecr batch-get-image --repository-name "$repository" --image-ids imageTag="$GITHUB_SHA" --query 'images[0].imageId.imageTag' --output text)
          if [ "$existing" != "$GITHUB_SHA" ]; then
            aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
            docker build -t "$image" backend
            docker push "$image"
          fi
      - name: Deploy tested commit through SSM
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re
          sha=os.environ['GITHUB_SHA']; assert re.fullmatch('[0-9a-f]{40}',sha)
          repo=os.environ['GITHUB_REPOSITORY']; image=os.environ['ECR_URL']+':'+sha
          release='/opt/findback/releases/'+sha
          commands=['set -eu', 'mkdir -p '+release+'/infrastructure']
          for name in ['compose.production.yml','Caddyfile','deploy.sh']:
              url='https://raw.githubusercontent.com/'+repo+'/'+sha+'/infrastructure/'+name
              commands.append('curl --fail --silent --show-error --retry 3 '+url+' -o '+release+'/infrastructure/'+name)
          commands.append('AWS_REGION='+os.environ['AWS_REGION']+' bash '+release+'/infrastructure/deploy.sh '+image+' '+release)
          with open('/tmp/deploy-parameters.json','w') as handle: json.dump({'commands':commands,'executionTimeout':['900']},handle)
          PY
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters file:///tmp/deploy-parameters.json --query Command.CommandId --output text)
          for attempt in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) exit 0 ;;
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '[StandardOutputContent,StandardErrorContent]' --output text
                exit 1 ;;
            esac
            sleep 5
          done
          echo 'SSM deployment did not complete before the timeout'
          exit 1
