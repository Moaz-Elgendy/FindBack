name: CI\non: [push, pull_request]\njobs:\n  backend:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with: { python-version: '3.11' }\n      - run: pip install -r backend/requirements.txt\n      - run: python -m compileall backend/app backend/alembic\n      - run: pytest\n        working-directory: backend\n  mobile:\n    runs-on: ubuntu-latest\n    defaults: { run: { working-directory: mobile } }\n    steps:\n      - uses: actions/checkout@v4\n      - uses: subosito/flutter-action@v2\n        with:\n          channel: stable\n          cache: true\n      # test/local_db_test.dart exercises the real SQLite statements through\n      # sqflite_common_ffi, which loads the system SQLite on Linux.\n      - name: Install SQLite (needed by the FFI database test)\n        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev\n      # android/ and ios/ are generated per developer machine by\n      # tool/setup_mobile.sh; the Dart side neither needs nor imports them, so CI\n      # stays fast by leaving them out.\n      - name: Resolve packages\n        run: flutter pub get\n      - name: Analyze\n        run: flutter analyze\n      - name: Test\n        run: flutter test --reporter expanded\n