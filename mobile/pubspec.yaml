name: findback
description: "FindBack - AI-powered memory for the internet. Save, then find by vague memory."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Network. Dio gives us connect/read timeouts and typed errors; the sync
  # queue depends on distinguishing "no network" from "server rejected it".
  connectivity_plus: ^7.3.2
  dio: ^5.4.0
  flutter_secure_storage: ^11.2.0
  path: ^1.8.0
  path_provider: ^2.1.0
  # Local-first cache + offline write queue (was expo-sqlite in the RN client).
  sqflite: ^2.3.0
  url_launcher: ^6.2.0
  # Cook Mode keeps the screen awake while following a recipe.
  wakelock_plus: ^1.1.0
  flutter_local_notifications: 23.0.0-dev.3
  flutter_timezone: ^5.1.1
  timezone: ^0.11.1
  share_plus: ^13.3.1
  # Push delivery for the weekly note. firebase_core initializes the SDK;
  # firebase_messaging supplies the registration token and its refresh stream.
  # Both are optional at runtime: without the platform config files the app
  # still runs and push is simply unavailable (see lib/services/push_registration.dart).
  firebase_core: ^4.2.0
  firebase_messaging: ^16.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Runs the real SQLite statements in `dart test` without an emulator.
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/categories.json
    - assets/fonts/SchibstedGrotesk-OFL.txt
    - assets/fonts/SourceSerif4-OFL.txt
  fonts:
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/noto-sans-arabic/NotoSansArabic.ttf
    - family: Schibsted Grotesk
      fonts:
        - asset: assets/fonts/SchibstedGrotesk.ttf
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
