services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: findback
      POSTGRES_PASSWORD: findback
      POSTGRES_DB: findback
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findback"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql://findback:findback@postgres:5432/findback
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      SCHEMA_BOOTSTRAP: none
      DATABASE_URL: postgresql://findback:findback@postgres:5432/findback
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app.celery worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql://findback:findback@postgres:5432/findback
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app

  # Runs the beat_schedule in app/celery_app.py. Without this process nothing
  # fires on a schedule: the worker only consumes messages, so the weekly note
  # would never be published.
  #
  # Exactly ONE instance, deliberately. Two beats would publish every scheduled
  # task twice on the same 15-minute tick. The weekly note survives that
  # (weekly_snapshots_user_week_uq makes the second run a no-op), but nothing
  # else on the schedule would -- so do not scale this service.
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app beat -l info
    env_file: .env
    environment:
      DATABASE_URL: postgresql://findback:findback@postgres:5432/findback
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app

  # Phase 5: republish processing jobs that a queue outage stranded. The worker
  # cannot recover them on its own -- a publish that failed at save time leaves
  # no Celery message anywhere -- so without this service a save taken while
  # Redis was down stays `pending` forever. Ticks every
  # OUTBOX_DISPATCH_INTERVAL_SECONDS (default 5).
  outbox:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m scripts.dispatch_outbox
    env_file: .env
    environment:
      DATABASE_URL: postgresql://findback:findback@postgres:5432/findback
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app

volumes:
  pgdata:
